[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solveig"
version = "0.7.2"
description = "An AI assistant that enables secure and extensible agentic behavior from any LLM in your terminal"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Francisco"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Terminals",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
keywords = ["ai", "automation", "security", "llm", "assistant"]
requires-python = ">=3.13"
dependencies = [
    "distro>=1.9.0",
    "openai>=1.108.0",
    "pydantic>=2.11.0",
    # Floor = developed/tested version; ceiling <3 because solveig pins framework
    # behaviors a major owes nothing to. tests/unit/test_pydantic_ai_invariants.py
    # is the upgrade gate: run it on any bump (tier labels say how to react).
    "pydantic-ai>=2.17,<3",
    # Imported at module scope by config/config.py, tools/base.py and
    # subcommands/base.py, so it is a DIRECT dependency — it used to arrive only
    # by way of fastmcp/mcp, which meant a clean install could resolve a version
    # older than the two APIs the code needs: `cli_shortcuts` on the settings
    # config, and `CliSettingsSource` accepting a plain BaseModel. Floor is the
    # developed/tested version, same rule as pydantic-ai above.
    "pydantic-settings>=2.14.2,<3",
    "textual>=6.1.0",
    # Required for default code themes.
    "pygments>=2.21.0",
    "rich>=14.0.0",
    # The web frontend is a first-class interface alongside the TUI, so its
    # HTTP server is core, not an optional extra: `pip install solveig` ships
    # all three renderable surfaces. `build_app`/`serve` import these.
    "blacksheep>=2.6.0",
    "uvicorn>=0.51.0",
    "httpx>=0.28.0",
    "fastmcp>=3.2.0",
    "pyperclip>=1.9.0",
    "anyconfig>=0.15.0",
    "pyyaml>=6.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "setuptools>=61.0",
    "anthropic>=0.68.0",
    "google-genai>=1.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.0",
    "aiohttp>=3.10.0",
]
anthropic = ["anthropic>=0.68.0"]
google = ["google-genai>=1.0.0"]
trafilatura = ["trafilatura>=2.0.0"]

[project.urls]
Homepage = "https://github.com/FSilveiraa/solveig"
About = "https://github.com/FSilveiraa/solveig/blob/main/docs/about.md"
Roadmap = "https://github.com/FSilveiraa/solveig/discussions/2"

[project.scripts]
solveig = "solveig.run:main"

[tool.setuptools.packages.find]
include = ["solveig*"]

[tool.setuptools.package-data]
solveig = [
    "system_prompt/stories/*.jsonl",
    # The served web SPA — vite's build output, `server.py` serves it from
    # `static/`. Ships in the wheel so a web install needs nothing built.
    "interface/web/static/*",
    "interface/web/static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["solveig/interface/tui/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]  # E501: line too long

[tool.mypy]
# `just typecheck` also passes --ignore-missing-imports; kept here so a bare
# `mypy solveig/` behaves the same. warn_unused_ignores keeps `# type: ignore`
# comments honest - a stale one (its underlying issue since fixed) becomes an error.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.importlinter]
# A module may only import its own layer or below. "|" = independent siblings,
# ":" = siblings that may import each other. TYPE_CHECKING and function-local
# imports both count.
root_packages = ["solveig", "config"]

[[tool.importlinter.contracts]]
id = "config-independent"
name = "The config library never imports Solveig"
# `config/` is a library Solveig uses, not part of Solveig: an app depends on
# it, never the other way around. Any import of `solveig` from inside `config`
# (TYPE_CHECKING and function-local included) fails here.
type = "forbidden"
source_modules = ["config"]
forbidden_modules = ["solveig"]

[[tool.importlinter.contracts]]
name = "Solveig layers"
type = "layers"
layers = [
    "solveig.run",
    "solveig.bootstrap",
    "solveig.agent",
    # Assembles what the agent may call from tools, plugins and MCP, so it sits
    # above all three.
    "solveig.toolset",
    "solveig.subcommands.registry",
    "solveig.session.display : solveig.session.manager : solveig.tools : solveig.mcp_servers : solveig.plugins : solveig.system_prompt : solveig.config.subcommands",
    "solveig.context : solveig.api.client",
    # `|`, not `:`. A frontend and the conversation are INDEPENDENT: a frontend
    # is handed text, a role and a set of actions, and has no business naming a
    # message. This delimiter is the machine check on that — `:` would permit
    # the import in both directions again. The protocol sits one layer down
    # because a frontend does of course import it (and import-linter refuses to
    # mix the two delimiters within one layer).
    "solveig.interface.tui | solveig.session.conversation",
    "solveig.interface.base",
    "solveig.subcommands.base : solveig.pending.user_message_queue",
    "solveig.config.config",
    # A section that moved out to the module owning its choices: named by the
    # config tree above, reading the framework below, so it sits between them.
    "solveig.api.types",
    # `solveig.pending.user_message` sits here for the same reason `todo` does: a
    # pending message is named by the queue that holds it, the frontend that draws
    # and edits it, and the wire that replicates it, and is owned by none of them.
    "solveig.utils | solveig.exceptions | solveig.interface.themes | solveig.todo | solveig.pending.user_message",
]

# --- Coverage: every module in the package is placed ----------------------
# A `layers` contract only constrains the modules it names, so an unnamed
# module is silently unchecked. The contracts below use `exhaustive = true`
# with one container per package: import-linter then FAILS if any child of
# that package is missing from the layer list. Every package in solveig/ is a
# container here, so every module is declared somewhere and a new file has to
# be placed when it is created, not when something breaks.
# They are also real layerings, not rubber stamps: within each package the
# order is the actual dependency direction.

[[tool.importlinter.contracts]]
name = "Every top-level module is placed"
type = "layers"
containers = ["solveig"]
exhaustive = true
# Coarser than "Solveig layers" above (which layers the sub-modules): at
# package granularity session/tools/interface are mutually entangled by
# design (interface.base reads session.conversation, session.display reads
# tools), so they share one non-independent layer here.
layers = [
    "run",
    "bootstrap",
    "agent",
    "toolset",
    "subcommands : session : tools : mcp_servers : plugins : system_prompt : config : interface : context : api : pending",
    "utils | exceptions | todo",
]

[[tool.importlinter.contracts]]
name = "Every solveig.api module is placed"
type = "layers"
containers = ["solveig.api"]
exhaustive = true
layers = ["client", "types"]

[[tool.importlinter.contracts]]
name = "Every solveig.config module is placed"
type = "layers"
containers = ["solveig.config"]
exhaustive = true
layers = ["subcommands", "config"]
# `config` is the root declaration naming every section; the framework it's
# built on is the separate `config` package. `subcommands` (the `/config`
# commands) sits above it, since it needs the interface and the command
# framework, which the root declaration must not.

[[tool.importlinter.contracts]]
name = "Every solveig.interface module is placed"
type = "layers"
containers = ["solveig.interface"]
exhaustive = true
# `wire` imports `base` (the protocol) and is imported by nothing internal yet —
# it sits beside the frontends, speaking the same ABC.
layers = ["config", "tui", "web", "wire", "base", "themes"]

[[tool.importlinter.contracts]]
name = "Every solveig.interface.base module is placed"
type = "layers"
containers = ["solveig.interface.base"]
exhaustive = true
layers = ["interface", "widgets | actions"]

[[tool.importlinter.contracts]]
name = "Every solveig.interface.tui module is placed"
type = "layers"
containers = ["solveig.interface.tui"]
exhaustive = true
layers = [
    "interface",
    "app",
    "input | pending | stats",
    "chat",
    "message",
    "collapsible",
    "button | tree",
    # The bottom of the package, and the one module here that config may name.
    # Everything above it draws; this only declares what can be configured.
    "config",
]

[[tool.importlinter.contracts]]
name = "Every solveig.mcp_servers module is placed"
type = "layers"
containers = ["solveig.mcp_servers"]
exhaustive = true
layers = ["client", "config"]

[[tool.importlinter.contracts]]
name = "Every solveig.pending module is placed"
type = "layers"
containers = ["solveig.pending"]
exhaustive = true
layers = ["user_message_queue", "user_message"]

[[tool.importlinter.contracts]]
name = "Every solveig.plugins module is placed"
type = "layers"
containers = ["solveig.plugins"]
exhaustive = true
# `hooks : tools` (siblings that may reach each other) rather than independent:
# plugins.tools -> tools.orchestration -> plugins.hooks is the designed round
# trip — orchestration runs the hooks and gives plugin tools their subcommand.
layers = ["discovery", "utils", "library", "hooks : tools : subcommands", "config"]

[[tool.importlinter.contracts]]
name = "Every solveig.plugins.library module is placed"
type = "layers"
containers = ["solveig.plugins.library"]
exhaustive = true
layers = ["shellcheck | trafilatura | tree"]

[[tool.importlinter.contracts]]
name = "Every solveig.session module is placed"
type = "layers"
containers = ["solveig.session"]
exhaustive = true
layers = ["display | manager", "conversation", "config"]

[[tool.importlinter.contracts]]
name = "Every solveig.subcommands module is placed"
type = "layers"
containers = ["solveig.subcommands"]
exhaustive = true
layers = ["registry", "base"]

[[tool.importlinter.contracts]]
name = "Every solveig.system_prompt module is placed"
type = "layers"
containers = ["solveig.system_prompt"]
exhaustive = true
layers = ["compose", "config"]

[[tool.importlinter.contracts]]
name = "Every solveig.tools module is placed"
type = "layers"
containers = ["solveig.tools"]
exhaustive = true
layers = ["available", "core", "orchestration", "base", "result", "config"]

[[tool.importlinter.contracts]]
name = "Every solveig.tools.core module is placed"
type = "layers"
containers = ["solveig.tools.core"]
exhaustive = true
layers = ["command | copy | delete | edit | http | move | read | todo | write"]

[[tool.importlinter.contracts]]
name = "Every solveig.utils module is placed"
type = "layers"
containers = ["solveig.utils"]
exhaustive = true
layers = ["misc | shell", "file"]

[[tool.importlinter.contracts]]
name = "Frontends depend only on the protocol"
type = "forbidden"
source_modules = ["solveig.interface.base", "solveig.interface.tui"]
forbidden_modules = [
    "solveig.session.manager",
    "solveig.session.display",
    "solveig.config.subcommands",
]

[[tool.importlinter.contracts]]
name = "Config does not depend on the API client"
type = "forbidden"
source_modules = ["solveig.config"]
forbidden_modules = ["solveig.api.client"]

[[tool.importlinter.contracts]]
name = "Toolset assembly reads MCP, not the other way round"
type = "forbidden"
source_modules = ["solveig.mcp_servers.client"]
forbidden_modules = ["solveig.tools", "solveig.toolset"]

[[tool.importlinter.contracts]]
name = "The config declaration doesn't import the interface protocol"
type = "forbidden"
# The `/config` commands (`solveig.config.subcommands`) do, legitimately; the
# declaration they edit doesn't. The `config` library is covered by
# "The config library never imports Solveig".
source_modules = ["solveig.config.config"]
forbidden_modules = ["solveig.interface.base"]

[[tool.importlinter.contracts]]
name = "Tools don't import session management"
type = "forbidden"
source_modules = ["solveig.tools"]
forbidden_modules = ["solveig.session.manager", "solveig.session.display"]

[[tool.importlinter.contracts]]
name = "System prompt doesn't import session manager"
type = "forbidden"
source_modules = ["solveig.system_prompt"]
forbidden_modules = ["solveig.session.manager"]
