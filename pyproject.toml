[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solveig"
version = "0.7.2"
description = "An AI assistant that enables secure and extensible agentic behavior from any LLM in your terminal"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Francisco"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Terminals",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
keywords = ["ai", "automation", "security", "llm", "assistant"]
requires-python = ">=3.13"
dependencies = [
    "distro>=1.9.0",
    "openai>=1.108.0",
    "pydantic>=2.11.0",
    # Floor = developed/tested version; ceiling <3 because solveig pins framework
    # behaviors a major owes nothing to. tests/unit/test_pydantic_ai_invariants.py
    # is the upgrade gate: run it on any bump (tier labels say how to react).
    "pydantic-ai>=2.17,<3",
    "textual>=6.1.0",
    "rich>=14.0.0",
    "httpx>=0.28.0",
    "fastmcp>=3.2.0",
    "pyperclip>=1.9.0",
    "anyconfig>=0.15.0",
    "pyyaml>=6.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "setuptools>=61.0",
    "anthropic>=0.68.0",
    "google-genai>=1.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.0",
    "aiohttp>=3.10.0",
]
anthropic = ["anthropic>=0.68.0"]
google = ["google-genai>=1.0.0"]
trafilatura = ["trafilatura>=2.0.0"]

[project.urls]
Homepage = "https://github.com/FSilveiraa/solveig"
About = "https://github.com/FSilveiraa/solveig/blob/main/docs/about.md"
Roadmap = "https://github.com/FSilveiraa/solveig/discussions/2"

[project.scripts]
solveig = "solveig.run:main"

[tool.setuptools.packages.find]
include = ["solveig*"]

[tool.setuptools.package-data]
solveig = ["system_prompt/stories/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["solveig/interface/cli/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]  # E501: line too long

[tool.mypy]
# `just typecheck` also passes --ignore-missing-imports; kept here so a bare
# `mypy solveig/` behaves the same. warn_unused_ignores keeps `# type: ignore`
# comments honest - a stale one (its underlying issue since fixed) becomes an error.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.importlinter]
# A module may only import its own layer or below. "|" = independent siblings,
# ":" = siblings that may import each other. TYPE_CHECKING and function-local
# imports both count.
root_package = "solveig"

[[tool.importlinter.contracts]]
name = "Solveig layers"
type = "layers"
layers = [
    "solveig.run",
    "solveig.bootstrap",
    "solveig.agent",
    "solveig.subcommands.registry",
    "solveig.session.display : solveig.session.manager : solveig.tools : solveig.mcp_servers : solveig.plugins : solveig.system_prompt : solveig.config.editor",
    "solveig.interface.base : solveig.interface.cli : solveig.session.conversation : solveig.context : solveig.api.client",
    "solveig.config.config : solveig.config.models : solveig.config.sources",
    "solveig.utils | solveig.exceptions | solveig.stats | solveig.interface.themes | solveig.api.types",
]

[[tool.importlinter.contracts]]
name = "Frontends depend only on the protocol"
type = "forbidden"
source_modules = ["solveig.interface.base", "solveig.interface.cli"]
forbidden_modules = [
    "solveig.session.manager",
    "solveig.session.display",
    "solveig.config.editor",
]

[[tool.importlinter.contracts]]
name = "Config does not depend on the API client"
type = "forbidden"
source_modules = ["solveig.config"]
forbidden_modules = ["solveig.api.client"]

[[tool.importlinter.contracts]]
name = "Toolset assembly reads MCP, not the other way round"
type = "forbidden"
source_modules = ["solveig.mcp_servers.client"]
forbidden_modules = ["solveig.tools"]
